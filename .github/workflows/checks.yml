name: Backend checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: uniportal_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      SECRET_KEY: uniportal-ci-only-not-for-production
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://postgres:ci-only-password@localhost:5432/uniportal_ci' || 'sqlite:///:memory:' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Django configuration
        run: python manage.py check
      - name: Check migration drift
        run: python manage.py makemigrations --check --dry-run
      - name: Run tests
        run: python manage.py test --noinput
      - name: Install PostgreSQL backup tools
        if: matrix.database == 'postgres'
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Verify synthetic database and media backup restore
        if: matrix.database == 'postgres'
        run: python scripts/check_backup_restore.py
