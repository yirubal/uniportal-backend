name: Backend checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image without credentials
        run: docker build --tag uniportal-ci .
      - name: Check installed image dependencies
        run: docker run --rm --network none uniportal-ci python -m pip check
      - name: Test the packaged app with isolated settings
        run: >-
          docker run --rm --network none
          -e DJANGO_SETTINGS_MODULE=config.settings.test -e READ_DOT_ENV=False
          uniportal-ci python manage.py test --noinput
      - name: Verify real image and scanned-PDF extraction
        run: >-
          docker run --rm --network none
          -e DJANGO_SETTINGS_MODULE=config.settings.test -e READ_DOT_ENV=False
          uniportal-ci python scripts/check_container_extraction.py

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: uniportal_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      SECRET_KEY: uniportal-ci-only-not-for-production
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://postgres:ci-only-password@localhost:5432/uniportal_ci' || 'sqlite:///:memory:' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Django configuration
        run: python manage.py check
      - name: Check migration drift
        run: python manage.py makemigrations --check --dry-run
      - name: Install worker and PostgreSQL tools
        if: matrix.database == 'postgres'
        run: sudo apt-get update && sudo apt-get install -y postgresql-client tesseract-ocr poppler-utils
      - name: Run tests
        run: python manage.py test --noinput
      - name: Build static assets without production credentials
        if: matrix.database == 'sqlite'
        run: python manage.py collectstatic --noinput --clear --settings=config.settings.build
      - name: Verify synthetic database and media backup restore
        if: matrix.database == 'postgres'
        run: python scripts/check_backup_restore.py
      - name: Verify interrupted worker recovery
        if: matrix.database == 'postgres'
        run: python scripts/check_worker_recovery.py --require-ocr
