{% extends "admin/change_form.html" %}
{% load i18n %}

{% block content %}
{{ block.super }}

{% if upload_pdfs_url %}
<div style="
  margin-top: 1rem;
  padding: 1.25rem 1.5rem;
  border-radius: var(--border-radius, 6px);
">
  <p style="
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--color-base-400, #9ca3af);
    margin: 0 0 0.65rem;
  ">Quick Actions</p>

  <a href="{{ upload_pdfs_url }}" style="
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.55rem 1.2rem;
    border-radius: var(--border-radius, 6px);
    font-size: 0.875rem;
    font-weight: 600;
    text-decoration: none;
    background: var(--color-primary-600, #7c3aed);
    color: #fff;
    transition: background 0.15s, transform 0.1s;
  "
  onmouseover="this.style.background='var(--color-primary-700, #6d28d9)'; this.style.transform='translateY(-1px)'"
  onmouseout="this.style.background='var(--color-primary-600, #7c3aed)'; this.style.transform='translateY(0)'">
    Upload and Process Exam PDFs
  </a>

  <p style="
    font-size: 0.75rem;
    color: var(--color-base-400, #9ca3af);
    margin: 0.5rem 0 0;
  ">Upload one schedule PDF and the attendance PDFs for this term.</p>
</div>
{% endif %}

{% endblock %}
