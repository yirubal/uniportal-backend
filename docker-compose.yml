x-django-env: &django-env
  DEBUG: ${DEBUG:-False}
  SECRET_KEY: ${SECRET_KEY:-django-insecure-1234567890abcdefghijklmnopqrstuvwxyz}
  DJANGO_SETTINGS_MODULE: config.settings.docker
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
  SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-False}
  CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-False}
  DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-uniportal}
  DB_ENGINE: django.db.backends.postgresql
  DB_NAME: ${DB_NAME:-uniportal}
  DB_USER: ${DB_USER:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:-postgres}
  DB_HOST: postgres
  DB_PORT: 5432
  USE_S3: ${USE_S3:-False}
  R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
  R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
  R2_BUCKET_NAME: ${R2_BUCKET_NAME:-uniportal-media}
  R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
  R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:-}
  R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-}
  AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}
  AWS_S3_CUSTOM_DOMAIN: ${AWS_S3_CUSTOM_DOMAIN:-}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-test-token}
  TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
  TELEGRAM_CHANNEL_ID: ${TELEGRAM_CHANNEL_ID:-}
  TELEGRAM_OFFICIAL_CHANNEL_ID: ${TELEGRAM_OFFICIAL_CHANNEL_ID:-}
  TELEGRAM_CHANNEL_LINK: ${TELEGRAM_CHANNEL_LINK:-https://t.me/unityuniversityportal}
  TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
  TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
  MINI_APP_URL: ${MINI_APP_URL:-http://localhost:3000}
  GROQ_API_KEY: ${GROQ_API_KEY:-test-key}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-test-key}
  GOOGLE_API_KEY: ${GOOGLE_API_KEY:-test-key}
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}

services:
  postgres:
    image: postgres:15-alpine
    container_name: uniportal-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-uniportal}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-uniportal}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - uniportal-network
    restart: unless-stopped

  django:
    build: .
    container_name: uniportal-backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput --clear &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers $${GUNICORN_WORKERS:-4} --worker-class sync --worker-tmp-dir /dev/shm --access-logfile - --error-logfile -"
    environment:
      <<: *django-env
      PORT: 8000
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - uniportal-network
    restart: unless-stopped

  bot:
    build: .
    container_name: uniportal-bot
    command: python manage.py run_bot
    profiles:
      - maintenance
    environment:
      <<: *django-env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - uniportal-network
    restart: "no"

volumes:
  postgres_data:
  static_volume:
  media_volume:
  logs_volume:

networks:
  uniportal-network:
    driver: bridge
